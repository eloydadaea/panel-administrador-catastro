<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Administrador</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="admin-body" style="align-items: center; min-height: 100vh; display: flex;">
    <div class="glass-container" style="max-width: 400px; margin: auto;">
        <h2>Bienvenido de vuelta!</h2>
        <p style="text-align: center; font-size: 0.85rem; color: #666; margin-bottom: 20px;">
            Ingresa tus credenciales proporcionadas por el especialista encargado de la plataforma.
        </p>
        
        <form id="loginForm">
            <div class="form-group">
                <label>Usuario (Correo):</label>
                <input type="email" id="email" required placeholder="correo@ejemplo.com">
            </div>
            <div class="form-group">
                <label>Contraseña:</label>
                <input type="password" id="password" required placeholder="********">
            </div>
            <button type="submit" id="btnLogin">Ingresar</button>
            <p id="errorMsg" style="color: red; font-size: 0.8rem; text-align: center; display: none;"></p>
        </form>
    </div>

   <script>
        const supabaseUrl = 'https://kseaqcwhsvenxtmpqjvu.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtzZWFxY3doc3Zlbnh0bXBxanZ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3NzA3NzYsImV4cCI6MjEwODM0Njc3Nn0.xb0jWWmc1AAplHZ_Whgy3d-OCvsQyKHR3W6zFpvcKvA';
        const clienteSupabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        async function checkSession() {
            const { data: { session } } = await clienteSupabase.auth.getSession();
            if (session) window.location.href = 'admin.html';
        }
        checkSession();

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnLogin');
            const errorMsg = document.getElementById('errorMsg');
            
            btn.disabled = true;
            btn.textContent = 'Verificando...';
            errorMsg.style.display = 'none';

            const { data, error } = await clienteSupabase.auth.signInWithPassword({
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            });

            if (error) {
                errorMsg.textContent = error.message; 
                errorMsg.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Ingresar';
            } else {
                window.location.href = 'admin.html';
            }
        });
    </script>
</body>
</html>
